name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e "./services/research[dev]"
      - run: python -m pytest services/research/tests -q

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # All three projects, not just core: apps/web now carries tests of its
      # own, and a type error in one of them would otherwise reach main.
      - run: npm run typecheck
      - run: npx vitest run

  fixtures-are-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e "./services/research[dev]"
      - name: Regenerate golden vectors
        run: python -m neurogrip.fixtures --out fixtures/conformance/golden.json
      - name: Fail if the committed fixture is stale
        run: |
          if ! git diff --exit-code -- fixtures/conformance/golden.json; then
            echo "::error::golden.json is stale. Run 'npm run fixtures' and commit the result."
            exit 1
          fi

  browser:
    # The tier that needs a real browser. WASM threads exist only under
    # cross-origin isolation, the oscilloscope's canvas path is skipped where an
    # element has no layout, and a horizontal overflow is a fact about a
    # rendered page. None of it can be checked in jsdom.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Cache the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      # apps/web/public/models is gitignored, so a fresh clone has no decoder
      # for the build to copy in. artifacts/ is tracked, so no Python is needed.
      - run: node scripts/stage-model.mjs
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
