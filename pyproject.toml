[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pclm"
version = "0.1.0"
description = "Real-time hand gesture control interface for prosthetic limb actuation"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "numpy>=1.24",
    "pydantic>=2.6",
    "scipy>=1.10",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]
ml = [
    "scikit-learn>=1.4",
    "onnxruntime>=1.17",
    "torch>=2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
